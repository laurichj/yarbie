[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Development only: the integration is custom_components/yarbie, which Home Assistant
# loads directly (HACS installs it from this repository). Nothing here is packaged.
[project]
name = "yarbie"
version = "0.2.0"
description = "Home Assistant integration for Yarbo robots, with a map editor panel"
requires-python = ">=3.13"
dependencies = [
    # The integration's manifest requirement (yarbo-local itself is vendored).
    "aiomqtt==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ty", "pytest-homeassistant-custom-component"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
# Home Assistant entities override cached attributes with properties by design
# (its CachedProperties metaclass); ty reads that as an invalid override.
invalid-property-type-override = "ignore"
invalid-mutable-override = "ignore"
